name: Build Insular Enhanced APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew :assembly:assembleCompleteFdroidDebug \
            --console=plain \
            --stacktrace \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: insular-enhanced-apk
          path: assembly/build/outputs/apk/completeFdroid/debug/assembly-complete-fdroid-debug.apk
          if-no-files-found: error
